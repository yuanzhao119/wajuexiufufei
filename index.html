<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>道路挖掘修复费计算系统 - 唐山市路北区市政设施服务所</title>
    <style>
        :root {
            --primary: #1a3a6b;
            --primary-light: #2a5298;
            --secondary: #d32f2f;
            --bg: #f5f7fa;
            --white: #ffffff;
            --border: #c0c8d4;
            --text: #1e2a3a;
            --text-light: #5a6a7e;
            --accent: #e8eef6;
            --row-hover: #f0f4fa;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "SimSun", "Songti SC", "Microsoft YaHei", serif;
            background: var(--bg);
            color: var(--text);
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: var(--white);
            border: 1px solid var(--border);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .header {
            background: var(--primary);
            color: var(--white);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--secondary);
        }
        .header h1 { font-size: 18px; font-weight: 600; letter-spacing: 1px; }
        .header .sub { font-size: 12px; opacity: 0.85; }
        .config-bar {
            padding: 16px 24px;
            background: var(--accent);
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            align-items: center;
        }
        .config-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        .config-group label { font-weight: 600; color: var(--primary); white-space: nowrap; }
        .config-group select, .config-group input[type="text"] {
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            background: var(--white);
            color: var(--text);
        }
        .config-group select:focus, .config-group input:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 2px rgba(42,82,152,0.15);
        }
        .config-group input[type="text"] { width: 220px; }
        .multiplier-box {
            padding: 6px 14px;
            background: var(--white);
            border: 1px solid var(--primary);
            border-radius: 4px;
            font-weight: 700;
            color: var(--secondary);
            font-size: 16px;
            min-width: 60px;
            text-align: center;
        }
        .project-title {
            padding: 14px 24px 6px;
            font-size: 15px;
            font-weight: 600;
            color: var(--primary);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        thead th {
            background: var(--primary-light);
            color: var(--white);
            font-weight: 600;
            padding: 10px 8px;
            text-align: center;
            border: 1px solid var(--primary-light);
            font-size: 13px;
            white-space: nowrap;
        }
        tbody td {
            padding: 6px 8px;
            border: 1px solid var(--border);
            text-align: center;
            vertical-align: middle;
        }
        tbody tr:nth-child(even) { background: #fafbfc; }
        tbody tr:hover { background: var(--row-hover); }
        tbody td select {
            width: 100%;
            padding: 6px 4px;
            border: 1px solid var(--border);
            border-radius: 3px;
            font-size: 13px;
            font-family: inherit;
            background: var(--white);
            color: var(--text);
        }
        tbody td select:focus { outline: none; border-color: var(--primary-light); }
        tbody td input[type="number"] {
            width: 100%;
            padding: 6px 4px;
            border: 1px solid var(--border);
            border-radius: 3px;
            font-size: 13px;
            font-family: inherit;
            text-align: center;
            background: var(--white);
            color: var(--text);
        }
        tbody td input[type="number"]:focus { outline: none; border-color: var(--primary-light); }
        .unit-cell { color: var(--text-light); font-size: 13px; }
        .price-cell { font-weight: 600; color: var(--primary); }
        .amount-cell { font-weight: 700; color: var(--secondary); }
        .subtotal-row td {
            background: var(--accent);
            font-weight: 700;
            font-size: 15px;
            color: var(--primary);
            padding: 10px 8px;
        }
        .subtotal-row .label { text-align: right; }
        .subtotal-row .value { text-align: left; color: var(--secondary); font-size: 18px; }
        .notice {
            padding: 14px 24px;
            font-size: 12px;
            line-height: 1.8;
            color: var(--text-light);
            background: #fcfcfc;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }
        .notice strong { color: var(--primary); }
        .final-row td {
            background: var(--primary);
            color: var(--white);
            font-weight: 700;
            font-size: 16px;
            padding: 14px 8px;
        }
        .final-row .label { text-align: right; }
        .final-row .value { text-align: left; font-size: 20px; color: #ffd54f; }
        .footer {
            padding: 16px 24px;
            text-align: right;
            font-size: 13px;
            color: var(--text-light);
            border-top: 1px solid var(--border);
            background: var(--white);
        }
        .footer .org { font-weight: 600; color: var(--primary); }
        .date-input {
            border: none;
            background: transparent;
            font-size: 13px;
            color: var(--text-light);
            font-family: inherit;
            text-align: right;
            outline: none;
            border-bottom: 1px dashed var(--border);
            padding: 2px 4px;
            width: 160px;
            margin-left: auto;
            display: block;
            margin-top: 6px;
            transition: all 0.2s;
        }
        .date-input:hover { border-bottom-color: var(--primary-light); }
        .date-input:focus {
            border-bottom: 1px solid var(--primary);
            color: var(--primary);
        }
        .btn-add {
            margin: 8px 24px 12px;
            padding: 8px 18px;
            background: var(--primary-light);
            color: var(--white);
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-add:hover { background: var(--primary); }
        .btn-remove {
            background: #e0e4ea;
            color: #c62828;
            border: none;
            border-radius: 3px;
            padding: 4px 10px;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-remove:hover { background: #ffcdd2; }
        @media (max-width: 700px) {
            .config-bar { flex-direction: column; align-items: flex-start; gap: 12px; }
            .header { flex-direction: column; align-items: flex-start; gap: 4px; }
            table { font-size: 12px; }
            thead th, tbody td { padding: 4px 3px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>道路挖掘修复费计算系统</h1>
        <span class="sub">唐山市路北区市政设施服务所</span>
    </div>

    <div class="config-bar">
        <div class="config-group">
            <label>计费模式：</label>
            <select id="calcMode">
                <option value="normal">正常挖掘修复</option>
                <option value="winter">冬季施工加收</option>
                <option value="new">新建/大修道路加收</option>
                <option value="both">冬季+新建叠加</option>
            </select>
        </div>
        <div class="config-group" id="yearGroup" style="display:none;">
            <label>道路交付年限：</label>
            <select id="yearSelect">
                <option value="3">一年内（3倍）</option>
                <option value="2.5">两年内（2.5倍）</option>
                <option value="2" selected>三年内（2倍）</option>
                <option value="1.5">四年内（1.5倍）</option>
                <option value="1.2">五年内（1.2倍）</option>
            </select>
        </div>
        <div class="config-group">
            <label>总倍数：</label>
            <span class="multiplier-box" id="multiplierDisplay">1</span>
        </div>
        <div class="config-group">
            <label>工程名称：</label>
            <input type="text" id="projectName" value="道路挖掘修复工程">
        </div>
    </div>

    <div class="project-title" id="projectTitleDisplay">道路挖掘修复费</div>

    <table>
        <thead>
            <tr>
                <th style="width:22%;">项目</th>
                <th style="width:12%;">数量</th>
                <th style="width:8%;">单位</th>
                <th style="width:6%;">×</th>
                <th style="width:14%;">单价（元）</th>
                <th style="width:10%;">单位</th>
                <th style="width:6%;">=</th>
                <th style="width:16%;">金额（元）</th>
                <th style="width:6%;">操作</th>
            </tr>
        </thead>
        <tbody id="itemBody">
            <!-- rows generated by JS -->
        </tbody>
        <tr class="subtotal-row">
            <td colspan="7" class="label">小计：</td>
            <td class="value" id="subtotalDisplay">0.00 元</td>
            <td></td>
        </tr>
    </table>

    <button class="btn-add" id="btnAdd">+ 添加项目</button>

    <div class="notice" id="noticeText">
        以上收费标准根据河北省冀建城〔2015〕43号文件执行。
    </div>

    <table>
        <tr class="final-row">
            <td colspan="7" class="label" id="finalLabel">合计：</td>
            <td class="value" id="finalDisplay">0.00 元</td>
            <td></td>
        </tr>
    </table>

    <div class="footer">
        <div class="org">唐山市路北区市政设施服务所</div>
        <input type="text" id="dateInput" class="date-input" value="">
    </div>
</div>

<script>
    // ==================== 单价数据（依据冀建城〔2015〕43号附件） ====================
    const PRICE_MAP = {
        "水泥路面（快速路）":       { price: 705,  unit: "平方米" },
        "水泥路面（主干道）":       { price: 595,  unit: "平方米" },
        "水泥路面（次干道）":       { price: 538,  unit: "平方米" },
        "水泥路面（支路）":         { price: 409,  unit: "平方米" },
        "沥青路面（快速路）":       { price: 554,  unit: "平方米" },
        "沥青路面（主干道）":       { price: 548,  unit: "平方米" },
        "沥青路面（次干道）":       { price: 460,  unit: "平方米" },
        "沥青路面（支路）":         { price: 328,  unit: "平方米" },
        "彩色环保砖便道":           { price: 243,  unit: "平方米" },
        "花岗岩便道":               { price: 487,  unit: "平方米" },
        "石材便道":                 { price: 362,  unit: "平方米" },
        "石材类停车场便道":         { price: 432,  unit: "平方米" },
        "普通砖便道":               { price: 137,  unit: "平方米" },
        "土便道":                   { price: 46,   unit: "平方米" },
        "花岗岩路缘石":             { price: 188,  unit: "米" },
        "石质路缘石":               { price: 93,   unit: "米" },
        "混凝土路缘石":             { price: 60,   unit: "米" },
        "回填砂 深0-1米":           { price: 225,  unit: "平方米" },
        "回填砂 深1-2米":           { price: 498,  unit: "平方米" },
        "回填砂 深2-3米":           { price: 770,  unit: "平方米" },
        "回填砂 深3-4米":           { price: 1042, unit: "平方米" },
        "回填砂 深4-5米":           { price: 1314, unit: "平方米" },
        "回填砂 深5-6米":           { price: 1586, unit: "平方米" },
        "回填砂 深6-7米":           { price: 1858, unit: "平方米" },
        "回填砂 深7-8米":           { price: 2130, unit: "平方米" },
        "回填砂 深8-9米":           { price: 2402, unit: "平方米" },
        "回填砂 深9-10米":          { price: 2674, unit: "平方米" },
        "回填砂 深度每增1米":       { price: 272,  unit: "平方米" },
        "回填土 深0-1米":           { price: 82,   unit: "平方米" },
        "回填土 深1-2米":           { price: 173,  unit: "平方米" },
        "回填土 深2-3米":           { price: 264,  unit: "平方米" },
        "回填土 深3-4米":           { price: 355,  unit: "平方米" },
        "回填土 深4-5米":           { price: 446,  unit: "平方米" },
        "回填土 深5-6米":           { price: 537,  unit: "平方米" },
        "回填土 深度每增1米":       { price: 91,   unit: "平方米" },
        "水泥路面 面层加宽（快速路）": { price: 440, unit: "平方米" },
        "水泥路面 面层加宽（主干道）": { price: 413, unit: "平方米" },
        "水泥路面 面层加宽（次干道）": { price: 358, unit: "平方米" },
        "水泥路面 面层加宽（支路）":   { price: 279, unit: "平方米" },
        "沥青路面 面层加宽（快速路）": { price: 324, unit: "平方米" },
        "沥青路面 面层加宽（主干道）": { price: 324, unit: "平方米" },
        "沥青路面 面层加宽（次干道）": { price: 218, unit: "平方米" },
        "沥青路面 面层加宽（支路）":   { price: 192, unit: "平方米" },
        "彩色环保砖便道（面层加宽）": { price: 127, unit: "平方米" },
        "花岗岩便道（面层加宽）":     { price: 369, unit: "平方米" },
        "石材便道（面层加宽）":       { price: 261, unit: "平方米" },
        "普通砖便道（面层加宽）":     { price: 62,  unit: "平方米" },
        "砖砌检查井∮1000":          { price: 10250, unit: "座" },
        "砖砌检查井∮1500":          { price: 12350, unit: "座" },
        "砖砌检查井∮2000":          { price: 14714, unit: "座" },
        "砖砌收水井680*380":        { price: 1789, unit: "座" },
        "砼管∮300":                 { price: 504,  unit: "米" },
        "砼管∮600":                 { price: 1612, unit: "米" },
        "收水井盖维修更换790*584":  { price: 1236, unit: "套" },
        "检查井盖维修更换∮620-∮700": { price: 1400, unit: "套" },
    };

    const ITEM_NAMES = Object.keys(PRICE_MAP);

    // ==================== 状态 ====================
    let items = [
        { name: "沥青路面（主干道）", qty: 4 },
        { name: "彩色环保砖便道", qty: 4 },
        { name: "混凝土路缘石", qty: 2 },
        { name: "花岗岩路缘石", qty: 4 },
        { name: "回填砂 深0-1米", qty: 5 },
        { name: "回填砂 深1-2米", qty: 6 },
        { name: "回填砂 深2-3米", qty: 7 },
    ];

    let currentMode = "normal";
    let currentYearMultiplier = 2;

    // ==================== DOM 引用 ====================
    const itemBody = document.getElementById("itemBody");
    const subtotalDisplay = document.getElementById("subtotalDisplay");
    const finalDisplay = document.getElementById("finalDisplay");
    const multiplierDisplay = document.getElementById("multiplierDisplay");
    const calcModeSelect = document.getElementById("calcMode");
    const yearGroup = document.getElementById("yearGroup");
    const yearSelect = document.getElementById("yearSelect");
    const projectNameInput = document.getElementById("projectName");
    const projectTitleDisplay = document.getElementById("projectTitleDisplay");
    const noticeText = document.getElementById("noticeText");
    const finalLabel = document.getElementById("finalLabel");
    const dateInput = document.getElementById("dateInput");

    // ==================== 工具函数 ====================
    function formatMoney(n) {
        return n.toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " 元";
    }

    function getPrice(name) {
        return PRICE_MAP[name] ? PRICE_MAP[name].price : 0;
    }

    function getUnit(name) {
        return PRICE_MAP[name] ? PRICE_MAP[name].unit : "";
    }

    // ==================== 渲染表格 ====================
    function renderItems() {
        itemBody.innerHTML = "";
        items.forEach((item, idx) => {
            const unit = getUnit(item.name);
            const price = getPrice(item.name);
            const amount = item.qty * price;

            const tr = document.createElement("tr");

            // 项目
            const tdName = document.createElement("td");
            const sel = document.createElement("select");
            ITEM_NAMES.forEach(n => {
                const opt = document.createElement("option");
                opt.value = n;
                opt.textContent = n;
                if (n === item.name) opt.selected = true;
                sel.appendChild(opt);
            });
            sel.addEventListener("change", (e) => {
                items[idx].name = e.target.value;
                renderItems();
            });
            tdName.appendChild(sel);
            tr.appendChild(tdName);

            // 数量
            const tdQty = document.createElement("td");
            const inp = document.createElement("input");
            inp.type = "number";
            inp.min = "0";
            inp.step = "0.1";
            inp.value = item.qty;
            inp.addEventListener("input", (e) => {
                let v = parseFloat(e.target.value);
                if (isNaN(v) || v < 0) v = 0;
                items[idx].qty = v;
                renderItems();
            });
            tdQty.appendChild(inp);
            tr.appendChild(tdQty);

            // 单位
            const tdUnit = document.createElement("td");
            tdUnit.className = "unit-cell";
            tdUnit.textContent = unit;
            tr.appendChild(tdUnit);

            // ×
            const tdTimes = document.createElement("td");
            tdTimes.textContent = "×";
            tr.appendChild(tdTimes);

            // 单价
            const tdPrice = document.createElement("td");
            tdPrice.className = "price-cell";
            tdPrice.textContent = price;
            tr.appendChild(tdPrice);

            // 单价单位
            const tdPriceUnit = document.createElement("td");
            tdPriceUnit.className = "unit-cell";
            tdPriceUnit.textContent = "元/" + unit;
            tr.appendChild(tdPriceUnit);

            // =
            const tdEq = document.createElement("td");
            tdEq.textContent = "=";
            tr.appendChild(tdEq);

            // 金额
            const tdAmount = document.createElement("td");
            tdAmount.className = "amount-cell";
            tdAmount.textContent = amount.toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            tr.appendChild(tdAmount);

            // 操作
            const tdOp = document.createElement("td");
            const btn = document.createElement("button");
            btn.className = "btn-remove";
            btn.textContent = "删除";
            btn.addEventListener("click", () => {
                if (items.length <= 1) {
                    alert("至少保留一个项目。");
                    return;
                }
                items.splice(idx, 1);
                renderItems();
            });
            tdOp.appendChild(btn);
            tr.appendChild(tdOp);

            itemBody.appendChild(tr);
        });

        // 更新小计与合计
        updateTotals();
    }

    // ==================== 更新金额 ====================
    function updateTotals() {
        const subtotal = items.reduce((sum, item) => {
            return sum + item.qty * getPrice(item.name);
        }, 0);

        subtotalDisplay.textContent = formatMoney(subtotal);

        // 根据模式计算总倍数
        let multiplier = 1;
        const mode = calcModeSelect.value;

        if (mode === "normal") {
            multiplier = 1;
            finalLabel.textContent = "合计：";
            noticeText.innerHTML = "以上收费标准根据河北省冀建城〔2015〕43号文件执行。";
        } else if (mode === "winter") {
            multiplier = 2;
            finalLabel.textContent = "合计（冬季施工×2）：";
            noticeText.innerHTML = "根据河北省冀建城〔2015〕43号文件精神，严格控制城市道路挖掘行为，冬季掘路（11月15日至翌年的3月15日），在规定年限加收基础上加收1倍掘路修复费。";
        } else if (mode === "new") {
            multiplier = currentYearMultiplier;
            finalLabel.textContent = `合计（新建/大修道路×${multiplier}）：`;
            noticeText.innerHTML = "根据河北省冀建城〔2015〕43号文件精神，严格控制城市道路挖掘行为，新建、扩建、改建的城市道路交付使用后五年内不得挖掘，大修的城市道路竣工后三年内不得挖掘。因特殊情况确需挖掘的，除履行行政审批手续外，要加倍收取挖掘修复费。具体为：一年内收取3倍、两年内收取2.5倍、三年内收取2倍、四年内收取1.5倍、五年内收取1.2倍的城市道路挖掘修复费用。掘路面积不足一平方米的按照一平方米收取。";
        } else if (mode === "both") {
            // 冬季+新建：先年限倍数，再冬季加收1倍
            multiplier = currentYearMultiplier + 1;
            finalLabel.textContent = `合计（冬季+新建，总倍数×${multiplier}）：`;
            noticeText.innerHTML = "根据河北省冀建城〔2015〕43号文件精神，严格控制城市道路挖掘行为，冬季掘路（11月15日至翌年的3月15日），在规定年限加收基础上加收1倍掘路修复费。新建、扩建、改建的城市道路交付使用后五年内不得挖掘，大修的城市道路竣工后三年内不得挖掘。因特殊情况确需挖掘的，除履行行政审批手续外，要加倍收取挖掘修复费。具体为：一年内收取3倍、两年内收取2.5倍、三年内收取2倍、四年内收取1.5倍、五年内收取1.2倍的城市道路挖掘修复费用。掘路面积不足一平方米的按照一平方米收取。";
        }

        multiplierDisplay.textContent = multiplier;

        const final = subtotal * multiplier;
        finalDisplay.textContent = formatMoney(final);

        // 更新标题
        const projName = projectNameInput.value.trim() || "道路挖掘修复工程";
        projectTitleDisplay.textContent = projName + "挖掘修复费";
    }

    // ==================== 事件监听 ====================
    calcModeSelect.addEventListener("change", () => {
        const mode = calcModeSelect.value;
        if (mode === "new" || mode === "both") {
            yearGroup.style.display = "flex";
        } else {
            yearGroup.style.display = "none";
        }
        updateTotals();
    });

    yearSelect.addEventListener("change", () => {
        currentYearMultiplier = parseFloat(yearSelect.value);
        updateTotals();
    });

    projectNameInput.addEventListener("input", () => {
        updateTotals();
    });

    document.getElementById("btnAdd").addEventListener("click", () => {
        items.push({ name: "沥青路面（主干道）", qty: 1 });
        renderItems();
    });

    // ==================== 初始化 ====================
    function init() {
        // 设置默认模式为“冬季+新建叠加”（符合截图需求）
        calcModeSelect.value = "both";
        yearGroup.style.display = "flex";
        yearSelect.value = "2";
        currentYearMultiplier = 2;

        // 初始化日期为当天（格式：YYYY年M月D日）
        const d = new Date();
        dateInput.value = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;

        renderItems();
    }

    init();
</script>
</body>
</html>
